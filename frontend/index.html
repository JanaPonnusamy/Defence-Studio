<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Defence Studio -- Content Intelligence Workspace</title>
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <noscript>This intelligence workspace requires JavaScript.</noscript>
  <div class="app-shell">
    <header class="brandbar" aria-label="Defence Studio">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 20 5v6c0 5.2-3.6 8.1-8 9.6C7.6 19.1 4 16.2 4 11V5Z"/>
            <path d="M12 7v10M8.5 10.5 12 7l3.5 3.5"/>
          </svg>
        </span>
        <span class="brand-name">
          <strong>Defence Studio</strong>
          <span>Content Intelligence Workspace</span>
        </span>
      </div>
      <div class="brandbar-right">
        <span class="conn conn--idle" id="conn-indicator" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span class="conn-text">Awaiting session</span>
        </span>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle colour theme"></button>
      </div>
    </header>
    <header class="topbar" id="topbar" aria-label="Job selection"></header>
    <nav class="tabs" id="tabs" aria-label="Workspace sections"></nav>
    <div class="filters" id="filters" aria-label="Filters"></div>
    <main class="workspace">
      <section class="list" id="list-panel" aria-label="List"></section>
      <section class="detail" id="detail-panel" aria-label="Detail"></section>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
