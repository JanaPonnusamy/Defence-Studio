[project]
name = "defence-align"
version = "0.1.0"
description = "Standalone word-level audio alignment engine (Defence Studio Phase 4, Component D). Maps a versioned narration transcript to timing derived from real audio. Independent of Phase 1-3 and of the TTS component."
requires-python = ">=3.11"
# Core runtime is deliberately light and offline: FastAPI + pydantic for the
# API and contracts, and the Python stdlib (`wave`, `sqlite3`, `hashlib`,
# `unicodedata`) for audio inspection, persistence, hashing, and Unicode-safe
# tokenization. No GPU, no paid credentials, no network at import time.
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.6,<3"]

[project.optional-dependencies]
# Real word-level forced alignment is OFF by default and never auto-installed.
# Enabling it requires a CPU-capable forced aligner + its model, fetched
# explicitly by the operator (see README "Enabling real alignment"). The
# adapter detects availability and otherwise reports UNSUPPORTED honestly.
real = ["torch>=2.2", "torchaudio>=2.2"]
# Broader audio decoding (MP3/FLAC/OGG) beyond the stdlib WAV path.
audio = ["soundfile>=0.12"]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
